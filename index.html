<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chain Reaction Arena</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #07071a 0%, #0d0d24 50%, #07071a 100%);
  color: #e0e0ff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 68px 16px 24px;
}

#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  padding: 0 20px;
  height: 48px;
  background: rgba(10, 10, 28, 0.92);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  z-index: 10;
}
.tb-side {
  flex: 1;
  font-size: 0.82rem;
  font-weight: 600;
  color: #9090c0;
}
.tb-side span { color: #e0e0ff; margin-left: 4px; }
.tb-side:last-child { text-align: right; }
.tb-side:last-child span { color: #ffc107; }
#mult-wrap {
  font-size: 0.9rem;
  font-weight: 700;
  color: #404060;
  padding: 3px 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}
#mult-wrap.active {
  color: #ffd54f;
  background: rgba(255,213,79,0.1);
  border-color: rgba(255,213,79,0.25);
}

h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #a0aaff;
}

#ui {
  display: flex;
  align-items: center;
  gap: 16px;
}

#turn-indicator {
  font-size: 0.95rem;
  font-weight: 600;
  padding: 6px 18px;
  border-radius: 20px;
  min-width: 148px;
  text-align: center;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
}

#turn-indicator.player { background: rgba(79,195,247,0.15); border: 1px solid #4fc3f7; color: #4fc3f7; }
#turn-indicator.ai     { background: rgba(239,83,80,0.15);  border: 1px solid #ef5350; color: #ef5350; }
#turn-indicator.win    { background: rgba(102,187,106,0.2); border: 1px solid #66bb6a; color: #66bb6a; }
#turn-indicator.lose   { background: rgba(239,83,80,0.2);   border: 1px solid #ef5350; color: #ef5350; }

#score-display {
  display: flex;
  gap: 14px;
  font-size: 0.85rem;
  font-weight: 600;
}
#score-val  { color: #e0e0ff; }
#mult-val   { color: #ffd54f; min-width: 28px; }
#coins-val  { color: #ffc107; }

button {
  background: transparent;
  border: 1px solid #3a3a5a;
  color: #a0aaff;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.88rem;
  transition: background 0.2s, border-color 0.2s;
}
button:hover { background: rgba(160,170,255,0.1); border-color: #a0aaff; }

canvas { display: block; cursor: pointer; }

#legend {
  display: flex;
  gap: 18px;
  font-size: 0.78rem;
  color: #555580;
}
.leg { display: flex; align-items: center; gap: 6px; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

#upgrade-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.8rem;
  padding: 7px 14px;
  border: 1px solid #252545;
  border-radius: 8px;
  color: #888aaa;
}
#upgrade-row strong { color: #c0caff; }
#upgrade-row button { padding: 4px 12px; font-size: 0.78rem; }

#goal-display {
  font-size: 0.82rem;
  color: #80cbc4;
  padding: 6px 14px;
  border: 1px solid #1e3a38;
  border-radius: 8px;
}
#goal-display.done { color: #a5d6a7; border-color: #2e5a30; }
</style>
</head>
<body>

<h1>Chain Reaction Arena</h1>

<div id="topbar">
  <div class="tb-side">Score<span id="score-val">0</span></div>
  <span id="mult-wrap">×<span id="mult-val">1</span></span>
  <div class="tb-side">Coins<span id="coins-val">0</span></div>
</div>

<div id="ui">
  <div id="turn-indicator" class="player">Your Turn</div>
  <button id="btn-restart">Restart</button>
</div>

<canvas id="canvas"></canvas>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#4fc3f7"></div><span>You (blue)</span></div>
  <div class="leg"><div class="leg-dot" style="background:#ef5350"></div><span>AI (red)</span></div>
  <div class="leg"><span>4 energy → explosion</span></div>
</div>

<div id="goal-display">Goal: —</div>

<div id="upgrade-row">
  <strong>Overcharge</strong>
  <span id="oc-desc">15% chance per level to spread +2 energy</span>
  <span id="oc-level">Lv 0 / 3</span>
  <button id="btn-buy-oc">Buy (5c)</button>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────

const GRID        = 6;
const CELL        = 80;
const PAD         = 20;
const OVERFLOW    = 4;
const CANVAS_SIZE = GRID * CELL + PAD * 2;

const COLORS = {
  bg:        '#0f0f23',
  gridLine:  '#252545',
  playerDot: '#4fc3f7',
  aiDot:     '#ef5350',
  hover:     'rgba(255,255,255,0.06)',
};

// Cell background colors as RGB triples — used for smooth interpolation.
const BG_RGB = {
  null:   [17,  17,  40],   // #111128
  player: [12,  39,  64],   // #0c2740
  ai:     [56,  12,  12],   // #380c0c
};

// ─── Color Utilities ──────────────────────────────────────────────────────────

function lerpRGB([r1,g1,b1], [r2,g2,b2], t) {
  return [r1 + (r2-r1)*t | 0, g1 + (g2-g1)*t | 0, b1 + (b2-b1)*t | 0];
}

function rgbStr([r, g, b]) { return `rgb(${r},${g},${b})`; }

function easeOut(t) { return 1 - (1-t) * (1-t); }

// ─── Animation State ──────────────────────────────────────────────────────────

let effects    = [];  // expanding ring objects
let particles  = [];  // energy orbs flying between cells
let flashes    = [];  // brief cell-fill overlays on explosion
let pops       = [];  // quick ring on energy placement
let floatTexts = [];  // score labels that float upward
let cellTr    = makeTrGrid();  // per-cell color transition state
let shake     = null;          // { amplitude, born, life }
let renderTime = 0;            // timestamp from the current RAF frame

function makeTrGrid() {
  return Array.from({ length: GRID }, () => new Array(GRID).fill(null));
}

// ─── Animation: Spawners ──────────────────────────────────────────────────────

// Three staggered rings + a cell flash, fired when a cell explodes.
function spawnExplosion(r, c, owner) {
  const [x, y, w, h] = cellRect(r, c);
  const cx = x + w/2, cy = y + h/2;
  const color = ownerDotColor(owner);
  const now = performance.now();

  for (let i = 0; i < 3; i++) {
    effects.push({ x: cx, y: cy, color, born: now + i * 75, life: 430 });
  }
  flashes.push({ r, c, color, born: now, life: 220 });
}

// Small orbs that fly from the exploding cell toward each of its neighbors.
function spawnParticles(r, c, owner) {
  const [sx, sy, sw, sh] = cellRect(r, c);
  const srcX = sx + sw/2, srcY = sy + sh/2;
  const color = ownerDotColor(owner);
  const now = performance.now();
  for (const [nr, nc] of neighbors(r, c)) {
    const [tx, ty, tw, th] = cellRect(nr, nc);
    particles.push({ x: srcX, y: srcY, tx: tx+tw/2, ty: ty+th/2,
                     color, born: now, life: 185 });
  }
}

// Accumulate shake; longer chains drive larger amplitude.
function triggerShake(chainStep = 1) {
  const base = Math.min(10, 2 + chainStep * 1.5 | 0);
  const amp  = shake ? Math.min(14, shake.amplitude + base) : base;
  shake = { amplitude: amp, born: performance.now(), life: 380 };
}

// Quick ring that pops out when the player places a piece.
function spawnPop(r, c, owner) {
  const [x, y, w, h] = cellRect(r, c);
  pops.push({ x: x + w/2, y: y + h/2, color: ownerDotColor(owner),
              born: performance.now(), life: 160 });
}

// Floating score label rising from an explosion centre.
function spawnFloatText(r, c, text, color) {
  const [x, y, w, h] = cellRect(r, c);
  floatTexts.push({ x: x + w/2, y: y + h/2 - 4, text, color,
                    born: performance.now(), life: 680 });
}

// Begin a color transition for one cell, picking up from wherever it currently is
// so a mid-flight transition doesn't snap.
function startOwnerTransition(r, c, fromOwner, toOwner) {
  const now = performance.now();
  const tr  = cellTr[r][c];
  const from = tr
    ? lerpRGB(tr.from, tr.to, easeOut(Math.min(1, (now - tr.born) / tr.life)))
    : [...BG_RGB[fromOwner]];
  cellTr[r][c] = { from, to: BG_RGB[toOwner], born: now, life: 280 };
}

// Diff two grids and start transitions for every cell whose owner changed.
// Must be called with the old grid captured *before* state.grid is updated.
function applyOwnerTransitions(oldGrid, newGrid) {
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      if (oldGrid[r][c].owner !== newGrid[r][c].owner)
        startOwnerTransition(r, c, oldGrid[r][c].owner, newGrid[r][c].owner);
}

// ─── Animation: Queries ───────────────────────────────────────────────────────

function getShakeOffset() {
  if (!shake) return [0, 0];
  const t = (renderTime - shake.born) / shake.life;
  if (t >= 1) { shake = null; return [0, 0]; }
  const decay = (1 - t) * (1 - t);
  return [
    Math.sin(t * 30) * shake.amplitude * decay,
    Math.sin(t * 23) * shake.amplitude * decay * 0.55,
  ];
}

function getCellBgColor(r, c) {
  const tr    = cellTr[r][c];
  const owner = state.grid[r][c].owner;
  if (!tr) return rgbStr(BG_RGB[owner]);
  const t = easeOut(Math.min(1, (renderTime - tr.born) / tr.life));
  if (t >= 1) { cellTr[r][c] = null; return rgbStr(BG_RGB[owner]); }
  return rgbStr(lerpRGB(tr.from, tr.to, t));
}

// ─── Goal System ─────────────────────────────────────────────────────────────

function genGoal() {
  const defs = [
    { type: 'score',  targets: [300, 500, 800], fmt: t => `Score ${t}+`             },
    { type: 'chains', targets: [5, 10, 15],     fmt: t => `${t} chain explosions`   },
    { type: 'moves',  targets: [10, 12, 15],    fmt: t => `Win within ${t} moves`   },
  ];
  const def    = defs[Math.floor(Math.random() * defs.length)];
  const target = def.targets[Math.floor(Math.random() * def.targets.length)];
  return { type: def.type, target, label: def.fmt(target), done: false };
}

// ─── State ────────────────────────────────────────────────────────────────────

let coins        = parseInt(localStorage.getItem('cra_coins')  || '0');
let upgOvercharge = parseInt(localStorage.getItem('cra_oc')    || '0');
const OC_MAX  = 3;
let state     = null;
let hoverCell = null;
let busy      = false;

function newState() {
  return {
    grid:       Array.from({ length: GRID }, () =>
                  Array.from({ length: GRID }, () => ({ owner: null, energy: 0 }))),
    turn:       'player',
    phase:      'input',  // 'input' | 'animating' | 'over'
    winner:     null,
    moves:       0,
    playerMoves: 0,
    chains:      0,
    score:       0,
    multiplier:  1,
    goal:        genGoal(),
  };
}

// ─── Game Logic ───────────────────────────────────────────────────────────────

function cloneGrid(grid) {
  return grid.map(row => row.map(cell => ({ ...cell })));
}

function neighbors(r, c) {
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]
    .filter(([nr, nc]) => nr >= 0 && nr < GRID && nc >= 0 && nc < GRID);
}

function canPlay(grid, r, c, player) {
  const { owner } = grid[r][c];
  return owner === null || owner === player;
}

function applyMove(grid, r, c, player) {
  const g = cloneGrid(grid);
  g[r][c].owner = player;
  g[r][c].energy += 1;
  return g;
}

// Resolves all chain explosions one at a time (restarting the scan after each).
// Returns the animation steps and the settled final grid.
function resolveChains(grid) {
  const steps = [];
  const g = cloneGrid(grid);

  let exploded = true;
  while (exploded) {
    exploded = false;
    outer:
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (g[r][c].energy >= OVERFLOW) {
          const owner = g[r][c].owner;
          g[r][c].energy -= OVERFLOW;
          if (g[r][c].energy === 0) g[r][c].owner = null;
          for (const [nr, nc] of neighbors(r, c)) {
            const bonus = (owner === 'player' && upgOvercharge > 0
              && Math.random() < 0.15 * upgOvercharge) ? 2 : 1;
            g[nr][nc].energy += bonus;
            g[nr][nc].owner = owner;
          }
          steps.push({ r, c, owner, snap: cloneGrid(g) });
          exploded = true;
          break outer;
        }
      }
    }
  }

  return { steps, final: g };
}

// Win requires both players to have moved, then only one owner left on the board.
function checkWin(grid, moves) {
  if (moves < 2) return null;
  const owners = new Set();
  for (const row of grid)
    for (const cell of row)
      if (cell.owner) owners.add(cell.owner);
  return owners.size === 1 ? [...owners][0] : null;
}

// ─── AI ───────────────────────────────────────────────────────────────────────

function validMoves(grid, player) {
  const moves = [];
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      if (canPlay(grid, r, c, player)) moves.push([r, c]);
  return moves;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function computeAIMove(grid) {
  const moves = validMoves(grid, 'ai');
  if (!moves.length) return null;

  // 1. Prefer moves that immediately trigger an explosion
  const explosionMoves = moves.filter(([r, c]) => grid[r][c].energy + 1 >= OVERFLOW);
  if (explosionMoves.length) return pickRandom(explosionMoves);

  // 2. Otherwise prefer the cell closest to exploding
  let bestMoves = [], bestEnergy = -1;
  for (const [r, c] of moves) {
    const e = grid[r][c].energy;
    if (e > bestEnergy)        { bestEnergy = e; bestMoves = [[r, c]]; }
    else if (e === bestEnergy) { bestMoves.push([r, c]); }
  }
  if (bestMoves.length) return pickRandom(bestMoves);

  // 3. Random fallback
  return pickRandom(moves);
}

// ─── Rendering: Helpers ───────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
canvas.width  = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

function cellRect(r, c) {
  return [PAD + c * CELL, PAD + r * CELL, CELL, CELL];
}

function ownerDotColor(owner) {
  return owner === 'player' ? COLORS.playerDot : COLORS.aiDot;
}

// Returns canvas positions for 1–4 dots arranged within a cell center.
function dotPositions(count, cx, cy) {
  const s = 20;
  switch (count) {
    case 1:  return [[cx, cy]];
    case 2:  return [[cx - s/2, cy], [cx + s/2, cy]];
    case 3:  return [[cx, cy - s/2], [cx - s/2, cy + s/2], [cx + s/2, cy + s/2]];
    default: return [[cx-s/2, cy-s/2], [cx+s/2, cy-s/2], [cx-s/2, cy+s/2], [cx+s/2, cy+s/2]];
  }
}

// ─── Rendering: Draw Functions ────────────────────────────────────────────────

function drawDots(x, y, w, h, cell) {
  const color = ownerDotColor(cell.owner);
  // Slow per-cell phase offset so dots breathe out of sync with each other.
  const phase  = (x * 0.31 + y * 0.19) * 0.05;
  const pulse  = 0.5 + 0.5 * Math.sin(renderTime * 0.002 + phase);
  ctx.fillStyle   = color;
  ctx.shadowColor = color;
  ctx.shadowBlur  = 6 + pulse * 8;
  const radius = 6.5 + pulse;
  for (const [dx, dy] of dotPositions(Math.min(cell.energy, 4), x + w/2, y + h/2)) {
    ctx.beginPath();
    ctx.arc(dx, dy, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawCell(r, c) {
  const [x, y, w, h] = cellRect(r, c);
  const cell = state.grid[r][c];

  const isHoverable = hoverCell && hoverCell[0] === r && hoverCell[1] === c
                      && state.phase === 'input' && state.turn === 'player'
                      && canPlay(state.grid, r, c, 'player');

  ctx.fillStyle = getCellBgColor(r, c);
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);

  if (isHoverable) {
    ctx.fillStyle = COLORS.hover;
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  }

  if (cell.energy > 0) drawDots(x, y, w, h, cell);
}

function drawGridLines() {
  ctx.strokeStyle = COLORS.gridLine;
  ctx.lineWidth   = 1.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(PAD + i * CELL, PAD);
    ctx.lineTo(PAD + i * CELL, PAD + GRID * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(PAD, PAD + i * CELL);
    ctx.lineTo(PAD + GRID * CELL, PAD + i * CELL);
    ctx.stroke();
  }
}

// Bright fill that fades on the cell that just exploded.
function drawFlashes(timestamp) {
  flashes = flashes.filter(f => {
    const t = (timestamp - f.born) / f.life;
    if (t >= 1) return false;
    const [x, y, w, h] = cellRect(f.r, f.c);
    ctx.globalAlpha = (1 - t) * 0.65;
    ctx.fillStyle   = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur  = 22;
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    return true;
  });
}

// Small orbs travelling from exploding cell to each neighbor.
function drawParticles(timestamp) {
  particles = particles.filter(p => {
    const t = (timestamp - p.born) / p.life;
    if (t >= 1) return false;
    // Ease-in-out so orbs accelerate then decelerate into target.
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    const x = p.x + (p.tx - p.x) * ease;
    const y = p.y + (p.ty - p.y) * ease;
    ctx.globalAlpha = t < 0.7 ? 1 : (1 - t) / 0.3;
    ctx.fillStyle   = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 8;
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    return true;
  });
}

// Small ring that pops on placement — faster and smaller than an explosion ring.
function drawPops(timestamp) {
  pops = pops.filter(p => {
    const t = (timestamp - p.born) / p.life;
    if (t >= 1) return false;
    const ease = 1 - (1 - t) * (1 - t);
    ctx.globalAlpha = (1 - t) * 0.75;
    ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 6;
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, ease * 22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    return true;
  });
}

// Score labels that drift upward and fade out.
function drawFloatTexts(timestamp) {
  floatTexts = floatTexts.filter(ft => {
    const t = (timestamp - ft.born) / ft.life;
    if (t >= 1) return false;
    const alpha = t < 0.25 ? 1 : 1 - (t - 0.25) / 0.75;
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = ft.color;
    ctx.shadowColor = ft.color;
    ctx.shadowBlur  = 5;
    ctx.font        = 'bold 12px Segoe UI, system-ui, sans-serif';
    ctx.textAlign   = 'center';
    ctx.fillText(ft.text, ft.x, ft.y - 36 * t);
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    ctx.textAlign   = 'left';
    return true;
  });
}

// Expanding rings; each effect has an optional `born` delay for staggering.
function drawEffects(timestamp) {
  effects = effects.filter(effect => {
    const t = (timestamp - effect.born) / effect.life;
    if (t < 0)  return true;   // delayed ring not yet started
    if (t >= 1) return false;
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = effect.color;
    ctx.shadowColor = effect.color;
    ctx.shadowBlur  = 14;
    ctx.lineWidth   = 2.5;
    ctx.beginPath();
    ctx.arc(effect.x, effect.y, 5 + t * 38, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    return true;
  });
}

// ─── Render Loop ──────────────────────────────────────────────────────────────

function renderLoop(timestamp) {
  renderTime = timestamp;

  // Clear outside the shake transform so any revealed edge shows the bg color.
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  ctx.save();
  ctx.translate(...getShakeOffset());

  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      drawCell(r, c);
  drawGridLines();
  drawFlashes(timestamp);
  drawParticles(timestamp);
  drawEffects(timestamp);
  drawPops(timestamp);
  drawFloatTexts(timestamp);

  ctx.restore();

  requestAnimationFrame(renderLoop);
}

// ─── Game Flow ────────────────────────────────────────────────────────────────

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

// Animates a single move and all resulting chain reactions.
// Returns the winner string if the game ended, otherwise null.
async function runMove(r, c, player) {
  const before = state.grid;
  state.grid = applyMove(state.grid, r, c, player);
  applyOwnerTransitions(before, state.grid);
  if (player === 'player') spawnPop(r, c, player);

  const { steps, final } = resolveChains(state.grid);
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    if (step.owner === 'player') {
      const earned = 10 * state.multiplier;
      state.score += earned;
      state.multiplier++;
      state.chains++;
      spawnFloatText(step.r, step.c, `+${earned}`, COLORS.playerDot);
      updateScoreDisplay();
    }
    spawnExplosion(step.r, step.c, step.owner);
    spawnParticles(step.r, step.c, step.owner);
    triggerShake(i + 1);
    await sleep(80);
    const prev = state.grid;
    state.grid = step.snap;
    applyOwnerTransitions(prev, state.grid);
  }
  if (player === 'player') {
    state.multiplier = 1;
    updateScoreDisplay();
  }
  state.grid = final;
  state.moves++;

  return checkWin(state.grid, state.moves);
}

function endGame(winner) {
  state.winner = winner;
  state.phase  = 'over';
  // Moves goal can only be met by winning within the limit.
  if (!state.goal.done && state.goal.type === 'moves'
      && winner === 'player' && state.playerMoves <= state.goal.target) {
    state.goal.done = true;
    coins += 50;
  }
  coins += Math.floor(state.score / 50);
  localStorage.setItem('cra_coins', coins);
  updateScoreDisplay();
  updateUI();
  busy = false;
}

async function doPlayerMove(r, c) {
  if (busy || state.phase !== 'input' || state.turn !== 'player') return;
  if (!canPlay(state.grid, r, c, 'player')) return;

  busy        = true;
  state.phase = 'animating';
  state.playerMoves++;
  updateUI();

  const playerWinner = await runMove(r, c, 'player');
  if (playerWinner) { endGame(playerWinner); return; }

  state.turn = 'ai';
  updateUI();
  await sleep(480);

  const aiMove = computeAIMove(state.grid);
  if (!aiMove) { endGame('player'); return; }

  const aiWinner = await runMove(aiMove[0], aiMove[1], 'ai');
  if (aiWinner) { endGame(aiWinner); return; }

  state.turn  = 'player';
  state.phase = 'input';
  updateUI();
  busy = false;
}

function checkGoalCompletion() {
  const g = state.goal;
  if (g.done) return;
  if (g.type === 'score'  && state.score  >= g.target) g.done = true;
  if (g.type === 'chains' && state.chains >= g.target) g.done = true;
  if (g.done) {
    coins += 50;
    localStorage.setItem('cra_coins', coins);
  }
}

function updateGoalDisplay() {
  const g = state.goal;
  let progress;
  if (g.type === 'score')  progress = `${state.score} / ${g.target}`;
  if (g.type === 'chains') progress = `${state.chains} / ${g.target}`;
  if (g.type === 'moves')  progress = `${state.playerMoves} / ${g.target} moves`;
  const suffix = g.done ? '  [complete! +50 coins]' : '';
  const el = document.getElementById('goal-display');
  el.textContent = `Goal: ${g.label}  —  ${progress}${suffix}`;
  el.className   = g.done ? 'done' : '';
}

function updateScoreDisplay() {
  document.getElementById('score-val').textContent  = state.score;
  document.getElementById('mult-val').textContent   = state.multiplier;
  document.getElementById('coins-val').textContent  = coins;
  document.getElementById('mult-wrap').className    = state.multiplier > 1 ? 'active' : '';
  checkGoalCompletion();
  updateGoalDisplay();
  refreshUpgradeBtn();
}

function refreshUpgradeBtn() {
  const maxed = upgOvercharge >= OC_MAX;
  const cost  = (upgOvercharge + 1) * 5;
  document.getElementById('oc-level').textContent = `Lv ${upgOvercharge} / ${OC_MAX}`;
  const btn = document.getElementById('btn-buy-oc');
  btn.textContent = maxed ? 'Maxed' : `Buy (${cost}c)`;
  btn.disabled    = maxed || coins < cost;
}

function buyOvercharge() {
  if (upgOvercharge >= OC_MAX) return;
  const cost = (upgOvercharge + 1) * 5;
  if (coins < cost) return;
  coins -= cost;
  upgOvercharge++;
  localStorage.setItem('cra_coins', coins);
  localStorage.setItem('cra_oc', upgOvercharge);
  updateScoreDisplay();
}

function updateUI() {
  const el = document.getElementById('turn-indicator');
  if (state.phase === 'over') {
    el.textContent = state.winner === 'player' ? 'You Win!' : 'AI Wins!';
    el.className   = state.winner === 'player' ? 'win' : 'lose';
  } else if (state.turn === 'player') {
    el.textContent = 'Your Turn';
    el.className   = 'player';
  } else {
    el.textContent = 'AI Thinking…';
    el.className   = 'ai';
  }
}

function restart() {
  state     = newState();
  effects    = [];
  particles  = [];
  flashes    = [];
  pops       = [];
  floatTexts = [];
  cellTr    = makeTrGrid();
  shake     = null;
  busy      = false;
  updateUI();
  updateScoreDisplay();
  updateGoalDisplay();
}

// ─── Input ────────────────────────────────────────────────────────────────────

function canvasToGrid(event) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (event.clientX - rect.left) * scaleX;
  const py = (event.clientY - rect.top)  * scaleY;
  const c  = Math.floor((px - PAD) / CELL);
  const r  = Math.floor((py - PAD) / CELL);
  return (r >= 0 && r < GRID && c >= 0 && c < GRID) ? [r, c] : null;
}

function bindInput() {
  canvas.addEventListener('click', e => {
    const pos = canvasToGrid(e);
    if (pos) doPlayerMove(pos[0], pos[1]);
  });

  canvas.addEventListener('mousemove', e => { hoverCell = canvasToGrid(e); });
  canvas.addEventListener('mouseleave', () => { hoverCell = null; });

  document.getElementById('btn-restart').addEventListener('click', restart);
  document.getElementById('btn-buy-oc').addEventListener('click', buyOvercharge);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

state = newState();
updateUI();
updateScoreDisplay();
bindInput();
requestAnimationFrame(renderLoop);
</script>
</body>
