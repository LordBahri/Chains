<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chain Reaction Arena</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a1a;
  color: #e0e0ff;
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #a0aaff;
}

#ui {
  display: flex;
  align-items: center;
  gap: 16px;
}

#turn-indicator {
  font-size: 0.95rem;
  font-weight: 600;
  padding: 6px 18px;
  border-radius: 20px;
  min-width: 148px;
  text-align: center;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
}

#turn-indicator.player { background: rgba(79,195,247,0.15); border: 1px solid #4fc3f7; color: #4fc3f7; }
#turn-indicator.ai     { background: rgba(239,83,80,0.15);  border: 1px solid #ef5350; color: #ef5350; }
#turn-indicator.win    { background: rgba(102,187,106,0.2); border: 1px solid #66bb6a; color: #66bb6a; }
#turn-indicator.lose   { background: rgba(239,83,80,0.2);   border: 1px solid #ef5350; color: #ef5350; }

button {
  background: transparent;
  border: 1px solid #3a3a5a;
  color: #a0aaff;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.88rem;
  transition: background 0.2s, border-color 0.2s;
}
button:hover { background: rgba(160,170,255,0.1); border-color: #a0aaff; }

canvas { display: block; cursor: pointer; }

#legend {
  display: flex;
  gap: 18px;
  font-size: 0.78rem;
  color: #555580;
}
.leg { display: flex; align-items: center; gap: 6px; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<h1>Chain Reaction Arena</h1>

<div id="ui">
  <div id="turn-indicator" class="player">Your Turn</div>
  <button id="btn-restart">Restart</button>
</div>

<canvas id="canvas"></canvas>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#4fc3f7"></div><span>You (blue)</span></div>
  <div class="leg"><div class="leg-dot" style="background:#ef5350"></div><span>AI (red)</span></div>
  <div class="leg"><span>4 energy → explosion</span></div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────

const GRID        = 6;
const CELL        = 80;
const PAD         = 20;
const OVERFLOW    = 4;
const CANVAS_SIZE = GRID * CELL + PAD * 2;

const COLORS = {
  bg:        '#0f0f23',
  empty:     '#111128',
  playerBg:  '#0c2740',
  aiBg:      '#380c0c',
  gridLine:  '#252545',
  playerDot: '#4fc3f7',
  aiDot:     '#ef5350',
  hover:     'rgba(255,255,255,0.06)',
};

// ─── State ────────────────────────────────────────────────────────────────────

let state   = null;   // game state object
let hoverCell = null; // [r, c] | null — grid cell under the mouse
let effects = [];     // active explosion ring effects
let busy    = false;  // true while a move + AI response is in progress

function newState() {
  return {
    grid:   Array.from({ length: GRID }, () =>
              Array.from({ length: GRID }, () => ({ owner: null, energy: 0 }))),
    turn:   'player',
    phase:  'input',  // 'input' | 'animating' | 'over'
    winner: null,
    moves:  0,
  };
}

// ─── Game Logic ───────────────────────────────────────────────────────────────

function cloneGrid(grid) {
  return grid.map(row => row.map(cell => ({ ...cell })));
}

function neighbors(r, c) {
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]
    .filter(([nr, nc]) => nr >= 0 && nr < GRID && nc >= 0 && nc < GRID);
}

function canPlay(grid, r, c, player) {
  const { owner } = grid[r][c];
  return owner === null || owner === player;
}

function applyMove(grid, r, c, player) {
  const g = cloneGrid(grid);
  g[r][c].owner = player;
  g[r][c].energy += 1;
  return g;
}

// Resolves all chain explosions one at a time (restarting the scan after each).
// Returns the animation steps and the settled final grid.
function resolveChains(grid) {
  const steps = [];
  const g = cloneGrid(grid);

  let exploded = true;
  while (exploded) {
    exploded = false;
    outer:
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (g[r][c].energy >= OVERFLOW) {
          const owner = g[r][c].owner;
          g[r][c].energy -= OVERFLOW;
          if (g[r][c].energy === 0) g[r][c].owner = null;
          for (const [nr, nc] of neighbors(r, c)) {
            g[nr][nc].energy += 1;
            g[nr][nc].owner = owner;
          }
          steps.push({ r, c, owner, snap: cloneGrid(g) });
          exploded = true;
          break outer;
        }
      }
    }
  }

  return { steps, final: g };
}

// Win requires both players to have moved, then only one owner left on the board.
function checkWin(grid, moves) {
  if (moves < 2) return null;
  const owners = new Set();
  for (const row of grid)
    for (const cell of row)
      if (cell.owner) owners.add(cell.owner);
  return owners.size === 1 ? [...owners][0] : null;
}

// ─── AI ───────────────────────────────────────────────────────────────────────

function validMoves(grid, player) {
  const moves = [];
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      if (canPlay(grid, r, c, player)) moves.push([r, c]);
  return moves;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function computeAIMove(grid) {
  const moves = validMoves(grid, 'ai');
  if (!moves.length) return null;

  // 1. Prefer moves that immediately trigger an explosion
  const explosionMoves = moves.filter(([r, c]) => grid[r][c].energy + 1 >= OVERFLOW);
  if (explosionMoves.length) return pickRandom(explosionMoves);

  // 2. Otherwise prefer the cell closest to exploding
  let bestMoves = [], bestEnergy = -1;
  for (const [r, c] of moves) {
    const e = grid[r][c].energy;
    if (e > bestEnergy)       { bestEnergy = e; bestMoves = [[r, c]]; }
    else if (e === bestEnergy) { bestMoves.push([r, c]); }
  }
  if (bestMoves.length) return pickRandom(bestMoves);

  // 3. Random fallback
  return pickRandom(moves);
}

// ─── Rendering ────────────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
canvas.width  = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

function cellRect(r, c) {
  return [PAD + c * CELL, PAD + r * CELL, CELL, CELL];
}

function ownerDotColor(owner) {
  return owner === 'player' ? COLORS.playerDot : COLORS.aiDot;
}

// Returns canvas positions for 1–4 dots laid out within a cell center.
function dotPositions(count, cx, cy) {
  const s = 20;
  switch (count) {
    case 1:  return [[cx, cy]];
    case 2:  return [[cx - s/2, cy], [cx + s/2, cy]];
    case 3:  return [[cx, cy - s/2], [cx - s/2, cy + s/2], [cx + s/2, cy + s/2]];
    default: return [[cx-s/2, cy-s/2], [cx+s/2, cy-s/2], [cx-s/2, cy+s/2], [cx+s/2, cy+s/2]];
  }
}

function drawDots(x, y, w, h, cell) {
  const color = ownerDotColor(cell.owner);
  ctx.fillStyle   = color;
  ctx.shadowColor = color;
  ctx.shadowBlur  = 8;
  for (const [dx, dy] of dotPositions(Math.min(cell.energy, 4), x + w/2, y + h/2)) {
    ctx.beginPath();
    ctx.arc(dx, dy, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawCell(r, c) {
  const [x, y, w, h] = cellRect(r, c);
  const cell = state.grid[r][c];

  const isHoverable = hoverCell && hoverCell[0] === r && hoverCell[1] === c
                      && state.phase === 'input' && state.turn === 'player'
                      && canPlay(state.grid, r, c, 'player');

  ctx.fillStyle = cell.owner === 'player' ? COLORS.playerBg
                : cell.owner === 'ai'     ? COLORS.aiBg
                : COLORS.empty;
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);

  if (isHoverable) {
    ctx.fillStyle = COLORS.hover;
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  }

  if (cell.energy > 0) drawDots(x, y, w, h, cell);
}

function drawGridLines() {
  ctx.strokeStyle = COLORS.gridLine;
  ctx.lineWidth   = 1.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(PAD + i * CELL, PAD);
    ctx.lineTo(PAD + i * CELL, PAD + GRID * CELL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(PAD, PAD + i * CELL);
    ctx.lineTo(PAD + GRID * CELL, PAD + i * CELL);
    ctx.stroke();
  }
}

function drawScene() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      drawCell(r, c);
  drawGridLines();
}

function drawEffects(timestamp) {
  effects = effects.filter(effect => {
    const t = (timestamp - effect.born) / effect.life;
    if (t >= 1) return false;
    ctx.globalAlpha = (1 - t) * 0.85;
    ctx.strokeStyle = effect.color;
    ctx.shadowColor = effect.color;
    ctx.shadowBlur  = 12;
    ctx.lineWidth   = 2.5;
    ctx.beginPath();
    ctx.arc(effect.x, effect.y, 6 + t * 44, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
    return true;
  });
}

function spawnEffect(r, c, owner) {
  const [x, y, w, h] = cellRect(r, c);
  effects.push({
    x: x + w / 2,
    y: y + h / 2,
    color: ownerDotColor(owner),
    born: performance.now(),
    life: 480,
  });
}

function renderLoop(timestamp) {
  drawScene();
  drawEffects(timestamp);
  requestAnimationFrame(renderLoop);
}

// ─── Game Flow ────────────────────────────────────────────────────────────────

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

// Animates a single move and all resulting chain reactions.
// Returns the winner string if the game ended, otherwise null.
async function runMove(r, c, player) {
  state.grid = applyMove(state.grid, r, c, player);

  const { steps, final } = resolveChains(state.grid);
  for (const step of steps) {
    spawnEffect(step.r, step.c, step.owner);
    await sleep(200);
    state.grid = step.snap;
  }
  state.grid = final;
  state.moves++;

  return checkWin(state.grid, state.moves);
}

function endGame(winner) {
  state.winner = winner;
  state.phase  = 'over';
  updateUI();
  busy = false;
}

async function doPlayerMove(r, c) {
  if (busy || state.phase !== 'input' || state.turn !== 'player') return;
  if (!canPlay(state.grid, r, c, 'player')) return;

  busy         = true;
  state.phase  = 'animating';
  updateUI();

  const playerWinner = await runMove(r, c, 'player');
  if (playerWinner) { endGame(playerWinner); return; }

  state.turn = 'ai';
  updateUI();
  await sleep(480);

  const aiMove = computeAIMove(state.grid);
  if (!aiMove) { endGame('player'); return; }

  const aiWinner = await runMove(aiMove[0], aiMove[1], 'ai');
  if (aiWinner) { endGame(aiWinner); return; }

  state.turn  = 'player';
  state.phase = 'input';
  updateUI();
  busy = false;
}

function updateUI() {
  const el = document.getElementById('turn-indicator');
  if (state.phase === 'over') {
    el.textContent = state.winner === 'player' ? 'You Win!' : 'AI Wins!';
    el.className   = state.winner === 'player' ? 'win' : 'lose';
  } else if (state.turn === 'player') {
    el.textContent = 'Your Turn';
    el.className   = 'player';
  } else {
    el.textContent = 'AI Thinking…';
    el.className   = 'ai';
  }
}

function restart() {
  state   = newState();
  effects = [];
  busy    = false;
  updateUI();
}

// ─── Input ────────────────────────────────────────────────────────────────────

function canvasToGrid(event) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (event.clientX - rect.left) * scaleX;
  const py = (event.clientY - rect.top)  * scaleY;
  const c  = Math.floor((px - PAD) / CELL);
  const r  = Math.floor((py - PAD) / CELL);
  return (r >= 0 && r < GRID && c >= 0 && c < GRID) ? [r, c] : null;
}

function bindInput() {
  canvas.addEventListener('click', e => {
    const pos = canvasToGrid(e);
    if (pos) doPlayerMove(pos[0], pos[1]);
  });

  canvas.addEventListener('mousemove', e => { hoverCell = canvasToGrid(e); });
  canvas.addEventListener('mouseleave', () => { hoverCell = null; });

  document.getElementById('btn-restart').addEventListener('click', restart);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

state = newState();
updateUI();
bindInput();
requestAnimationFrame(renderLoop);
</script>
</body>
</html>
